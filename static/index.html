<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moodline — read the emotion in your words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" id="statusDot" title="checking server..."></span>
      <span class="brand-name">Moodline</span>
    </div>
    <p class="brand-tag">An App that reads the mood By a sentence</p>
  </header>

  <main>
    <section class="console" id="console">
      <div class="input-panel">
        <span class="eyebrow">INPUT</span>
        <textarea
          id="textInput"
          maxlength="2000"
          placeholder="Write a sentence and let it speak for itself..."
        ></textarea>

        <div class="input-footer">
          <span class="char-count"><span id="charCount">0</span> / 2000</span>
          <button id="analyzeBtn" class="btn-primary" disabled>
            <span class="btn-label">Read the mood</span>
          </button>
        </div>
        <p class="error-msg" id="errorMsg" hidden></p>
      </div>
    </section>

    <!-- UPDATED RESULT SECTION -->
    <section class="result" id="resultSection" hidden>
      <div class="reveal card-dark">
        <span class="eyebrow">DETECTED</span>
        <div class="reveal-main">
          <span class="reveal-emoji" id="emotionEmoji">😄</span>
          <h1 id="emotionWord">Joy</h1>
        </div>
        <span class="confidence-mono" id="confidenceText">92.4% confidence</span>
        
        <hr class="divider">
        
        <blockquote class="echoed-text" id="echoedText"></blockquote>
      </div>

      <div class="breakdown card-dark">
        <span class="eyebrow">BREAKDOWN</span>
        <div class="bars" id="barsContainer"></div>
      </div>
    </section>
  </main>

  <footer class="footbar">
    <span id="serverStatusText" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #888;">connecting to model…</span>
  </footer>
</div>

<script src="/static/script.js"></script>
</body>
</html>
